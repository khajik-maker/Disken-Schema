<style>
:root{--maroon:#8b002f;--line:#b9b9b9;--bg:#f4f5f7;--card:#fff;--muted:#6b7280;--green:#bfe8c5;--fm:#f6d87b;--em:#d89bc6;--lad:#76cbd2;--blue:#b8e6ef;--orange:#f5a66b;--red:#f28b82;--purple:#c7b6ee}

.shift-columns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:start;width:100%;min-width:0}.shift-panel{border:1px solid #bbb;border-radius:4px;overflow:hidden;background:#fff;min-width:0;width:100%}.shift-panel-head{background:#eee;border-bottom:2px solid #999;padding:10px;text-align:center}.shift-panel-title{font-size:22px;font-weight:800}.shift-times{font-size:12px;color:#555;margin-top:3px}.shift-table{width:100%;margin:0;table-layout:fixed}.shift-label{width:58px}.person-col{width:82px}.shift-table .name{text-align:center!important;padding-left:4px!important}.shift-table .grouphead{height:30px}.shift-table .shiftcell{font-size:11px}.shift-table small{font-weight:600;font-size:9px}.shift-panel .table th,.shift-panel .table td{height:42px;font-size:11px;white-space:nowrap}.shift-panel .table th{font-size:10px}.shift-panel .table th:not(.shift-label):not(.person-col),.shift-panel .table td:not(.shiftcell):not(.name){padding:0 1px}
.table th{background:#eee;font-size:14px}.labelcol{width:180px}.grouphead{background:#5e625e!important;color:#fff;font-weight:800}.shiftcell{background:#eee;font-weight:700;vertical-align:middle;width:105px}.name{font-weight:700;background:#fafafa;text-align:left!important;padding-left:10px!important}.green{background:var(--green)!important;font-weight:800}.station616{background:var(--em)!important}.station621{background:var(--fm)!important}.stationLAD{background:var(--lad)!important}.empty{background:#fff}.weekend{background:#fff!important}.subhead{background:#eee;font-weight:800}.sectionTitle{font-size:18px;font-weight:800;margin:18px 0 8px}.small{font-size:12px;color:var(--muted)}.legend{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0;font-size:13px}.legend span{padding:5px 8px;border:1px solid #ddd;border-radius:6px}.other-grid{display:grid;grid-template-columns:220px repeat(7,1fr);min-width:900px}.other-grid>div{border:1px solid var(--line);min-height:48px;padding:7px}.other-name{font-weight:700}.status{font-weight:700;border-radius:5px;padding:5px;display:inline-block;width:100%}.möte{background:var(--blue)}.admin{background:#ddd}.sjuk{background:var(--red)}.ledig{background:var(--orange)}.semester{background:var(--purple)}.form{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.form label{display:flex;flex-direction:column;gap:4px;font-size:12px}.form input,.form select{padding:8px;border:1px solid #bbb;border-radius:7px}.danger{background:#fff1f1!important;border-color:#e5a3a3!important}.notice{padding:10px;border-radius:8px;background:#eef5ff;margin-bottom:10px}.hidden{display:none}@media(max-width:700px){.weeks{grid-template-columns:1fr}.brand{font-size:22px}.wrap{padding:10px}.panel#schema{overflow-x:auto}.shift-columns{grid-template-columns:repeat(3,560px);min-width:1700px}.shift-panel{min-width:560px}}

.week-schedule{display:flex;flex-direction:column;gap:12px;min-width:0}.wide-shift{border:1px solid #999;background:#fff;overflow:hidden}.wide-shift-head{height:58px;background:#eee;border-bottom:2px solid #888;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.wide-shift-head b{font-size:24px}.wide-shift-head span{font-size:12px;color:#555}.team-strip{display:flex;align-items:stretch;overflow-x:auto;min-width:0}.team-block{flex:0 0 auto;min-width:280px;border-right:2px solid #777;background:#fff}.team-block:last-child{border-right:0}.team-block-title{background:#5e625e;color:#fff;font-weight:800;text-align:center;padding:7px 6px;font-size:14px}.team-block-title span{font-weight:400;font-size:10px;margin-left:5px}.team-days-head{display:grid;grid-template-columns:repeat(var(--teamdays),minmax(82px,1fr));background:#eee;border-bottom:1px solid #aaa}.team-days-head>div{text-align:center;padding:5px 2px;font-weight:800;font-size:11px;border-right:1px solid #bbb}.team-days-head small{display:block;font-size:9px;font-weight:600}.person-line{display:grid;grid-template-columns:105px repeat(var(--teamdays),minmax(82px,1fr));min-height:43px;border-bottom:1px solid #bbb}.person-name{display:flex;align-items:center;justify-content:center;font-weight:700;background:#fafafa;border-right:1px solid #aaa;font-size:12px}.person-cell{display:flex;align-items:center;justify-content:center;border-right:1px solid #bbb;font-size:14px;min-width:82px}.person-cell:last-child{border-right:0}.team-block .green{background:var(--green)!important}.team-block .weekend{background:#fff!important}.team-block{min-width:calc(105px + var(--teamdays) * 82px)}
@media(min-width:1100px){.team-strip{overflow-x:visible}.team-block{min-width:0;flex:1 1 0}.person-line{grid-template-columns:88px repeat(var(--teamdays),minmax(60px,1fr))}.person-cell{min-width:0}}

/* Exact layout matching the reference sheet: FM / EM / Natt side-by-side. */
.schedule-scroll{width:100%;overflow-x:auto}
.shift-columns-exact{display:grid;grid-template-columns:repeat(3,minmax(720px,1fr));gap:8px;min-width:2160px;align-items:start}
.exact-shift{background:#fff;border:1px solid #aaa;overflow:hidden}
.exact-title{height:58px;background:#eee;border-bottom:2px solid #999;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.exact-title b{font-size:24px}.exact-title span{font-size:12px;color:#555;margin-top:4px}
.exact-table{width:100%;border-collapse:collapse;table-layout:fixed;font-family:Arial,Helvetica,sans-serif}
.exact-table th,.exact-table td{border:1px solid #aaa;text-align:center;height:42px;padding:0}
.exact-table thead th{background:#eee;font-size:13px;height:54px}
.exact-table thead th small{display:block;font-size:11px;margin-top:2px}
.exact-table .c-shift{width:82px}.exact-table .c-name{width:112px}.exact-table .c-day{width:auto}
.exact-table .group{background:#5e625e;color:#fff;font-size:15px;text-align:left;padding-left:8px;height:36px}
.exact-table .time{background:#eee;font-weight:700;font-size:11px;white-space:nowrap}
.exact-table .person{font-weight:700;background:#fafafa;font-size:14px}
.exact-table .driver{background:var(--green)!important}
.exact-table .blank{background:#fff!important;color:#222}
.exact-table .station616,.exact-table .station621,.exact-table .stationLAD{font-size:15px}
.five-team-strip{display:flex;width:100%;align-items:stretch;overflow:hidden;background:#fff}.five-team-block{flex:var(--span) 1 0;min-width:0;border-right:2px solid #777}.five-team-block:last-child{border-right:0}.five-team-days{display:grid;grid-template-columns:repeat(var(--span),minmax(0,1fr));background:#eee;border-bottom:1px solid #aaa}.five-team-days>div{text-align:center;font-weight:800;font-size:12px;padding:5px 2px;border-right:1px solid #aaa}.five-team-days small{display:block;font-size:9px}.five-person-row{display:grid;grid-template-columns:105px repeat(var(--span),minmax(0,1fr));min-height:42px;border-bottom:1px solid #aaa}.five-person-name{display:flex;align-items:center;justify-content:center;font-weight:700;background:#fafafa;border-right:1px solid #aaa;font-size:13px}.five-person-name.driver{background:var(--green)!important}.five-station{display:flex;align-items:center;justify-content:center;border-right:1px solid #aaa;font-size:15px}.team-strip-cell{padding:0!important;background:#fff}.five-team-block .weekend{background:#fff!important}.five-team-block .blank{background:#fff!important}@media(max-width:900px){.shift-columns-exact{grid-template-columns:repeat(3,720px);min-width:2160px}.five-team-strip{min-width:720px}.five-team-block{min-width:280px}}

.station-label-row{background:#5e625e!important;border-right:1px solid var(--line)}
.driver-cell{background:var(--green)!important;font-weight:800}
</style>

<body><div class="top"></div><div class="wrap">
<div class="bar"><div class="brand">Arbetsschema</div><div class="controls"><button id="prev">‹</button><div id="range" class="weeknav"></div><button id="next">›</button><button id="today">Idag</button></div></div>
<div class="weeks" id="weeks"></div><noscript><div class="notice"><b>Mobilvisning:</b> JavaScript körs inte i filförhandsvisningen. Här visas en statisk förhandsvisning av vecka 41.</div><div class="panel" style="margin-top:10px"><h2 style="margin-top:0">Arbetsschema – förhandsvisning</h2><div style="overflow:auto"><table class="exact-table" style="min-width:900px"><thead><tr><th>Skift</th><th>Operatör</th><th>Mån 5/10</th><th>Tis 6/10</th><th>Ons 7/10</th><th>Tor 8/10</th><th>Fre 9/10</th><th>Lör 10/10</th><th>Sön 11/10</th></tr></thead><tbody><tr><th class="group" colspan="9">FM</th></tr><tr><td>06:30–14:45</td><td>5-skift</td><td></td><td></td><td>Niklas</td><td>Niklas</td><td>Oliver</td><td>Oliver</td><td>Oliver</td></tr><tr><th class="group" colspan="9">EM</th></tr><tr><td>14:10–22:50</td><td>5-skift</td><td></td><td></td><td>Suzi</td><td>Suzi</td><td>Niklas</td><td>Niklas</td><td>Niklas</td></tr><tr><th class="group" colspan="9">Natt</th></tr><tr><td>22:30–07:00</td><td>5-skift</td><td></td><td>Emir</td><td>Saad</td><td>Saad</td><td>Suzi</td><td>Suzi</td><td>Suzi</td></tr></tbody></table></div><p class="small">Öppna filen i Safari för full interaktiv funktion.</p></div></noscript>
<div class="tabs"><button class="tab active" data-tab="schema">Schema</button><button class="tab" data-tab="ovrigt">Övrigt / Personalplanering</button><button class="tab" data-tab="info">Regler</button></div>
<section id="schema" class="panel"></section>
<section id="ovrigt" class="panel hidden"></section>
<section id="info" class="panel hidden"></section>
</div>
<script>
const teams5=[
 {id:'saad',name:'Saads lag',driver:'Saad',people:['Saad','Anette','P.O']},
 {id:'suzi',name:'Suzis lag',driver:'Suzi',people:['Suzi','Assaf','Rebecka']},
 {id:'oliver',name:'Oliviers lag',driver:'Oliver',people:['Oliver','Johanna','Maan']},
 {id:'emir',name:'Emirs lag',driver:'Emir',people:['Emir','Amphon','Razmik']},
 {id:'niklas',name:'Niklas lag',driver:'Niklas',people:['Niklas','Khajik','Kidane']}
];
const teams2=[{id:'nathalie',people:['Nathalie','Cecilia','Cribbe']},{id:'kim',people:['Kim','Martin','Filip']}];
const allPeople=[...teams5.flatMap(t=>t.people),...teams2.flatMap(t=>t.people)];
const weekdays=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];
const statusTypes=['Möte','Admin','Sjuk','VAB','Ledig','Semester'];
const colors={616:'station616',621:'station621',LAD:'stationLAD'};
let anchor=getMonday(new Date());
let selectedWeekOffset=0;
let extras={};
try { extras=JSON.parse(localStorage.getItem('schemaExtras')||'{}'); } catch(e) { extras={}; }
function iso(d){return d.toISOString().slice(0,10)}
function getMonday(d){let x=new Date(d);x.setHours(12,0,0,0);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function weekNo(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));let day=x.getUTCDay()||7;x.setUTCDate(x.getUTCDate()+4-day);let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}
function fmt(d){return `${d.getDate()}/${d.getMonth()+1}`}
function daysForWeek(mon){return Array.from({length:7},(_,i)=>addDays(mon,i))}
function weekPattern(startDay){ // 1 Mon, 3 Wed, 5 Fri
 if(startDay===1)return ['FM','FM','EM','EM','N','N','N'];
 if(startDay===3)return ['FM','FM','EM','EM','EM','N','N'];
 return ['FM','FM','FM','EM','EM','N','N'];
}
function teamShiftOn(teamId,date){
  // The roster is anchored to the real Excel schedule. Week 42 and 43 are
  // the verified reference weeks supplied by the user. Other weeks continue
  // from the same weekly 5-team rotation rather than using the old 12-day
  // approximation.
  const verified = {
    42: {
      FM:['emir','emir','saad','saad','suzi','suzi','suzi'],
      EM:['oliver','oliver','emir','emir','saad','saad','saad'],
      N:['niklas','niklas','suzi','suzi','emir','emir','niklas']
    },
    43: {
      FM:['niklas','niklas','oliver','oliver','emir','emir','emir'],
      EM:['saad','saad','suzi','suzi','niklas','niklas','niklas'],
      N:['emir','emir','saad','saad','suzi','suzi','suzi']
    }
  };
  const monday=getMonday(date);
  const w=weekNo(monday);
  const dow=(date.getDay()+6)%7;
  if(verified[w]){
    for(const shift of ['FM','EM','N']){
      if(verified[w][shift][dow]===teamId)return shift;
    }
    return null;
  }

  // Continue the verified weekly cycle. This preserves the actual order of
  // the teams while keeping every day populated for FM/EM/Natt.
  const weekOrder={
    FM:['niklas','niklas','oliver','oliver','emir','emir','emir'],
    EM:['saad','saad','suzi','suzi','niklas','niklas','niklas'],
    N:['emir','emir','saad','saad','suzi','suzi','suzi']
  };
  const delta=w-43;
  const teamAt=(arr,day)=>arr[((day + delta*7)%7+7)%7];
  for(const shift of ['FM','EM','N']){
    if(teamAt(weekOrder[shift],dow)===teamId)return shift;
  }
  return null;
}
function active5(team,date){
  const shift=teamShiftOn(team.id,date);
  return shift?{shift}:null;
}
function twoShiftGroup(date){
 // Alternates by ISO week: week containing 7 Oct 2026 is Nathalie FM / Kim EM.
 const w=weekNo(date); return (w-weekNo(new Date(2026,9,5)))%2===0?'nathalie':'kim';
}
function working2(teamId,date){let dow=(date.getDay()+6)%7;if(dow>=5)return null;let fm=twoShiftGroup(date);let isFM=teamId===fm;return {shift:isFM?'FM':'EM',shiftEnd:isFM?'14:30':'23:00'} }
function stationAssignments(names,dayIndex){
 const base=['616','621','LAD'];
 const out={};
 names.forEach((n,i)=>out[n]=base[(i+dayIndex)%3]);
 return out;
}
function dayRows(date){
 let active5s=teams5.map(t=>({team:t,state:active5(t,date)})).filter(x=>x.state);
 let active2s=teams2.map(t=>({team:t,state:working2(t.id,date)})).filter(x=>x.state);
 return {active5s,active2s};
}
function render(){
 const monday=addDays(anchor,selectedWeekOffset*7); const days=daysForWeek(monday);
 document.getElementById('range').textContent=`Vecka ${weekNo(monday)}`;
 document.getElementById('weeks').innerHTML=[0,1,2].map(i=>{let d=addDays(monday,i*7);return `<div class="weekcard ${i===0?'active':''}" data-i="${i}"><div class="weektitle">Vecka ${weekNo(d)}</div><div class="dateRange">${fmt(d)}–${fmt(addDays(d,6))}</div></div>`}).join('');
 document.querySelectorAll('.weekcard').forEach(c=>c.onclick=()=>{selectedWeekOffset=Number(c.dataset.i);render()});
 renderSchema(days);renderExtras(days);renderInfo();
}
function stationCell(st){return st?`<td class="${colors[st]}">${st}</td>`:'<td class="weekend"></td>'}
function renderSchema(days){
  const meta={
    FM:{title:'FM',time5:'06:30–14:45',time2:'06:00–14:30'},
    EM:{title:'EM',time5:'14:10–22:50',time2:'14:00–23:00'},
    N:{title:'Natt',time5:'22:30–07:00',time2:null}
  };
  let html=`<div class="schedule-scroll"><div class="shift-columns-exact">`;

  ['FM','EM','N'].forEach(shift=>{
    const m=meta[shift];
    html+=`<section class="exact-shift">
      <div class="exact-title"><b>${m.title}</b><span>5-skift: ${m.time5}${m.time2?` &nbsp;|&nbsp; 2-skift: ${m.time2}`:''}</span></div>
      <table class="exact-table">
        <colgroup><col class="c-shift"><col class="c-name">${days.map(()=>'<col class="c-day">').join('')}</colgroup>
        <thead><tr><th>Skift</th><th>Operatör</th>${days.map((d,i)=>`<th>${weekdays[i]}<small>${fmt(d)}</small></th>`).join('')}</tr></thead>
        <tbody>`;

    // 2-skift ALLTID ÖVERST. Only the team/person is shown on the days it actually works.
    // Visa bara det 2-skiftlag som faktiskt arbetar i detta skift.
    // Exempel: om Nathalies lag går FM ska Kims lag (inkl. Filip) inte finnas i FM-blocket alls.
    const twoTeamsForShift=teams2.filter(team=>days.some(d=>{const w=working2(team.id,d);return w&&w.shift===shift;}));
    const twoPeople=twoTeamsForShift.flatMap(team=>team.people.map(p=>({team,p})));
    const hasTwo=twoPeople.length>0;
    if(hasTwo){
      html+=`<tr><th class="group" colspan="9">2-skift</th></tr>`;
      twoPeople.forEach(({team,p},row)=>{
        html+=`<tr><td class="time">${row===0?(shift==='FM'?'06:00–14:30':'14:00–23:00'):''}</td><td class="person">${p}</td>`;
        days.forEach((d,i)=>{
          const w=working2(team.id,d);
          if(!w || w.shift!==shift){html+=`<td class="blank"></td>`;return;}
          const workers=[
            ...teams5.filter(t=>{const st=active5(t,d);return st&&st.shift===shift}).flatMap(t=>t.people),
            ...teams2.filter(t=>{const st=working2(t.id,d);return st&&st.shift===shift}).flatMap(t=>t.people)
          ];
          const station=stationForPerson(p,workers,i);
          html+=`<td class="${colors[station]||'blank'}">${station||''}</td>`;
        });
        html+=`</tr>`;
      });
    }

    // 5-skift UNDER 2-skift. Each worker slot runs horizontally across Monday-Sunday,
    // so a row can read e.g. Suzi | Suzi | Niklas | Niklas | Oliver | Oliver | Oliver.
    html+=`<tr><th class="group" colspan="9">5-skift</th></tr>`;
    for(let row=0;row<3;row++){
      html+=`<tr><td class="time">${row===0?m.time5:''}</td><td class="station-label-row"></td>`;
      days.forEach((d,i)=>{
        const team=teams5.find(t=>{const st=active5(t,d);return st&&st.shift===shift;});
        if(!team){html+=`<td class="blank"></td>`;return;}
        const p=team.people[row];
        const workers=[
          ...teams5.filter(t=>{const st=active5(t,d);return st&&st.shift===shift}).flatMap(t=>t.people),
          ...teams2.filter(t=>{const st=working2(t.id,d);return st&&st.shift===shift}).flatMap(t=>t.people)
        ];
        const station=stationForPerson(p,workers,i);
        html+=`<td class="${colors[station]||'blank'}">${station||''}</td>`;
      });
      html+=`</tr>`;

      html+=`<tr><td class="time"></td><td class="person">`;
      // Name cells are placed directly beneath their station row.
      html+=`</td>`;
      days.forEach(d=>{
        const team=teams5.find(t=>{const st=active5(t,d);return st&&st.shift===shift;});
        if(!team){html+=`<td class="blank"></td>`;return;}
        const p=team.people[row];
        const driver=p===team.driver;
        html+=`<td class="person ${driver?'driver-cell':''}">${p}</td>`;
      });
      html+=`</tr>`;
    }

    html+=`</tbody></table></section>`;
  });
  html+=`</div></div>`;
  document.getElementById('schema').innerHTML=html;
}

function stationForPerson(person,workers,dayIndex){
  const idx=workers.indexOf(person);
  if(idx<0)return null;
  // Weekend: 5-shift names are shown without station numbers.
  if(dayIndex>=5)return null;
  // Six weekday workers -> exactly two on each station.
  return ['616','616','621','621','LAD','LAD'][idx] || null;
}
function renderExtras(days){
 let html=`<div class="form"><label>Namn<input id="exPerson" type="text" list="personList" placeholder="Skriv namn"></label><datalist id="personList">${allPeople.map(p=>`<option value="${p}">`).join('')}</datalist><label>Datum<input id="exDate" type="date" value="${iso(days[0])}"></label><label>Alternativ<select id="exType">${["Sjuk","Möte","Admin","Utbildning","VAB"].map(s=>`<option>${s}</option>`).join('')}</select></label><label>Kommentar/tid<input id="exText" placeholder="t.ex. Möte 13:00"></label><button id="addEx">Lägg till</button><button id="clearEx" class="danger">Rensa alla sparade avvikelser</button></div><p class="small">Skriv namn, välj datum och välj typ. Uppgifterna sparas lokalt i webbläsaren.</p>`;
 html+=`<div class="other-grid" style="margin-top:12px"><div class="subhead">Övrigt / Personalplanering</div>${days.map((d,i)=>`<div class="subhead">${weekdays[i]}<br>${fmt(d)}</div>`).join('')}`;
 allPeople.forEach(p=>{html+=`<div class="other-name">${p}</div>`+days.map(d=>{let e=extras[`${p}|${iso(d)}`];return `<div>${e?`<div class="status ${e.type.toLowerCase()}">${e.type}${e.text?'<br>'+e.text:''}</div>`:''}</div>`}).join('')});html+='</div>';
 document.getElementById('ovrigt').innerHTML=html;
 document.getElementById('addEx').onclick=()=>{let p=exPerson.value.trim(),d=exDate.value,t=exType.value,txt=exText.value.trim();if(!p)return alert('Skriv in ett namn.');if(!d)return;extras[`${p}|${d}`]={type:t,text:txt};try { localStorage.setItem('schemaExtras',JSON.stringify(extras)); } catch(e) {} renderExtras(days)};
 document.getElementById('clearEx').onclick=()=>{if(confirm('Rensa alla sparade planeringar?')){extras={};try { localStorage.setItem('schemaExtras','{}'); } catch(e) {} renderExtras(days)}};
}
function renderInfo(){document.getElementById('info').innerHTML=`<h2>Regler i automatiken</h2><ul><li>5-skift: 7 arbetspass + 5 dygn ledigt. Startdagar måndag, onsdag eller fredag.</li><li>FM 06:30–14:45, EM 14:10–22:50, Natt 22:30–07:00.</li><li>Start måndag: FM, FM, EM, EM, Natt, Natt, Natt.</li><li>Start onsdag: FM, FM, EM, EM, EM, Natt, Natt.</li><li>Start fredag: FM, FM, FM, EM, Natt, Natt, Natt.</li><li>2-skift byter FM/EM varje vecka. FM måndag–fredag; EM måndag–torsdag.</li><li>2-skift: FM 06:00–14:30, EM 14:00–23:00.</li><li>Helg: endast 5-skift arbetar och inga stationsnummer visas.</li><li>Vardagar: 616, 621 och LAD bemannas med två personer vardera när sex personer arbetar.</li><li>Driftaren är den fasta driftaren för sitt lag och markeras grönt.</li></ul><p class="small">Schemat byggs dag för dag: varje lag visas bara i det skift de faktiskt arbetar den dagen.</p>`}
function setTab(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));['schema','ovrigt','info'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==tab))}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
document.getElementById('prev').onclick=()=>{anchor=addDays(anchor,-7);render()};
document.getElementById('next').onclick=()=>{anchor=addDays(anchor,7);render()};
document.getElementById('today').onclick=()=>{anchor=getMonday(new Date());selectedWeekOffset=0;render()};
render();
</script></body></html>
